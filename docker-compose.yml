version: '3.8'

services:
  cade-server:
    # Build from local source or use official image when available
    build: .
    restart: unless-stopped
    ports:
      # Expose native port for local access if needed
      - "8284:8284"
    volumes:
      # Persist SQLite memory, agent settings, and skills
      - cade_data:/root/.cade
      # Optional: Mount a workspace for the agent to modify
      - ./workspace:/workspace
    environment:
      - RUST_LOG=info
      - CADE_SERVER_PORT=8284
      - CADE_ALLOWED_ORIGIN=${CADE_ALLOWED_ORIGIN:-*}
      # Required LLM Provider keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

volumes:
  cade_data:
