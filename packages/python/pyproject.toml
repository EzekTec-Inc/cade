[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cade-sdk"
version = "0.2.4"
description = "Official Python SDK for CADE — In-Process Agent Runtime, Team Squads, and Typed Telemetry"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "EzekTec", email = "engineering@ezektec.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/EzekTec-Inc/CADE"
Repository = "https://github.com/EzekTec-Inc/CADE"
