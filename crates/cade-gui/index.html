<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CADE Dashboard</title>
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0f1115;
    color: #e5e7eb;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #cade_gui_canvas {
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    display: flex;
    position: absolute;
    inset: 0;
  }
  .cade-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f1115;
    color: #9ca3af;
    font-size: 14px;
    transition: opacity 0.25s ease-out;
  }
  .cade-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #272833;
    border-top-color: #ff7c5c;
    border-radius: 50%;
    animation: cade-spin 0.8s linear infinite;
  }
  @keyframes cade-spin {
    to { transform: rotate(360deg); }
  }
</style>
<!-- Add Tailwind CSS for pixel-perfect design matching CADE -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cadeDark: '#0f1115',
          cadeCard: '#16171d',
          cadeBorder: '#272833',
          cadeAccent: '#ff7c5c',
        }
      }
    }
  }
</script>
<link data-trunk rel="rust" data-wasm-opt="0" />
<script>
  function dismissLoader() {
    var loader = document.getElementById("cade-loader");
    if (loader && !loader.dataset.dismissed) {
      loader.dataset.dismissed = "true";
      loader.style.opacity = "0";
      setTimeout(function() { loader.remove(); }, 250);
    }
  }
  window.addEventListener("TrunkApplicationStarted", dismissLoader);
  var checkInterval = setInterval(function() {
    var canvas = document.getElementById("cade_gui_canvas");
    if (canvas && canvas.children.length > 0) {
      clearInterval(checkInterval);
      dismissLoader();
    }
  }, 100);
  window.addEventListener("error", function(e) {
    var loader = document.getElementById("cade-loader");
    if (loader && !loader.dataset.dismissed && !loader.dataset.error) {
      loader.dataset.error = "true";
      loader.innerHTML = '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-weight:600;color:#ef4444;font-size:16px;margin-bottom:8px;">CADE GUI Error</div>' +
        '<div style="color:#9ca3af;font-size:13px;max-width:480px;text-align:center;word-break:break-word;">' + (e.message || e) + '</div>' +
        '<button onclick="location.reload()" style="margin-top:16px;background:#ff7c5c;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;">Reload</button>';
    }
  });
</script>
</head>
<body class="bg-[#0f1115] text-[#e5e7eb]">
<div id="cade-loader" class="cade-loader">
  <div class="cade-spinner"></div>
  <div style="font-weight: 500; color: #e5e7eb;">Loading CADE Dashboard…</div>
</div>
<div id="cade_gui_canvas" class="h-screen w-screen flex"></div>
</body>
</html>
