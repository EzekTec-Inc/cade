<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CADE Dashboard</title>
<base href="/dashboard/">
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0f1115;
    color: #e5e7eb;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #cade_gui_canvas {
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    display: flex;
    position: absolute;
    inset: 0;
  }
  .cade-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f1115;
    color: #9ca3af;
    font-size: 14px;
  }
  #cade-loader[data-dismissed="true"] {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    opacity: 0 !important;
  }
  .cade-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #272833;
    border-top-color: #ff7c5c;
    border-radius: 50%;
    animation: cade-spin 0.8s linear infinite;
  }
  svg.w-8 {
    width: 32px !important;
    height: 32px !important;
    min-width: 32px !important;
    min-height: 32px !important;
    flex-shrink: 0 !important;
  }
  @keyframes cade-spin {
    to { transform: rotate(360deg); }
  }
</style>
<!-- Pre-compiled offline Tailwind CSS (zero external CDN dependencies) -->
<link data-trunk rel="copy-file" href="tailwind.js" />
<script src="/dashboard/tailwind.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cadeDark: '#0f1115',
          cadeCard: '#16171d',
          cadeBorder: '#272833',
          cadeAccent: '#ff7c5c',
        }
      }
    }
  }
</script>
<script>
(function() {
  var STARTUP_TIMEOUT_MS = 10000;
  var POLL_INTERVAL_MS = 100;
  var pollTimer = null;
  var timeoutTimer = null;

  window.__CADE_GUI_READY = false;
  window.__cade_diag = window.__cade_diag || [];

  function log(message) {
    var line = "[" + new Date().toISOString().slice(11, 19) + "] " + message;
    window.__cade_diag.push(line);
    console.log("[CADE]", message);
  }

  function loaderElement() {
    return document.getElementById("cade-loader");
  }

  function stopWatchdogs() {
    if (pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    if (timeoutTimer !== null) {
      clearTimeout(timeoutTimer);
      timeoutTimer = null;
    }
  }

  function dismissLoader() {
    var loader = loaderElement();
    if (!loader) {
      return;
    }
    loader.dataset.dismissed = "true";
    loader.style.display = "none";
    loader.style.visibility = "hidden";
    loader.style.pointerEvents = "none";
    try {
      loader.remove();
    } catch (e) {
      // Older browsers may not support remove(); hidden state above is enough.
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function ready(reason) {
    if (window.__CADE_GUI_READY) {
      return;
    }
    window.__CADE_GUI_READY = true;
    log(reason || "Dashboard marked ready.");
    stopWatchdogs();
    dismissLoader();
  }

  function error(title, detail) {
    if (window.__CADE_GUI_READY) {
      return;
    }
    stopWatchdogs();
    var loader = loaderElement();
    if (!loader || loader.dataset.dismissed || loader.dataset.error) {
      return;
    }
    loader.dataset.error = "true";
    loader.style.display = "flex";
    loader.style.visibility = "visible";
    loader.style.pointerEvents = "auto";
    var diagText = window.__cade_diag.length > 0
      ? window.__cade_diag.join("\n")
      : "No diagnostic logs captured.";
    loader.innerHTML = '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
      '<div style="font-weight:600;color:#ef4444;font-size:16px;margin-bottom:8px;">' + escapeHtml(title) + '</div>' +
      '<div style="color:#9ca3af;font-size:13px;max-width:520px;text-align:center;margin-bottom:12px;">' + escapeHtml(detail) + '</div>' +
      '<pre style="background:#16171d;color:#f87171;padding:12px;border-radius:8px;font-size:11px;max-width:560px;max-height:160px;overflow:auto;text-align:left;white-space:pre-wrap;border:1px solid #272833;margin-bottom:16px;">' + escapeHtml(diagText) + '</pre>' +
      '<div style="display:flex;gap:12px;">' +
      '<button onclick="location.reload()" style="background:#ff7c5c;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;">Reload</button>' +
      '<button onclick="location.href=location.pathname+String.fromCharCode(63,95,116,61)+Date.now()" style="background:#272833;color:#e5e7eb;border:1px solid #3f4350;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;">Bypass Cache & Reload</button>' +
      '</div>';
  }

  function canvasHasMountedApp() {
    var canvas = document.getElementById("cade_gui_canvas");
    return !!(canvas && canvas.children.length > 0);
  }

  function checkReady() {
    if (canvasHasMountedApp()) {
      var canvas = document.getElementById("cade_gui_canvas");
      ready("Canvas children detected (" + canvas.children.length + ").");
      return true;
    }
    return false;
  }

  window.cadeDashboardStartup = {
    ready: ready,
    error: error,
    log: log,
    checkReady: checkReady
  };
  window.cadeLog = log;

  log("Dashboard startup readiness module armed.");

  window.addEventListener("TrunkApplicationStarted", function() {
    log("TrunkApplicationStarted event received.");
    if (!checkReady()) {
      ready("TrunkApplicationStarted event received before canvas children were visible.");
    }
  });

  pollTimer = window.setInterval(checkReady, POLL_INTERVAL_MS);
  timeoutTimer = window.setTimeout(function() {
    if (!window.__CADE_GUI_READY && !checkReady()) {
      error("CADE Dashboard Startup Timeout", "The WebAssembly application did not initialize within 10 seconds. Diagnostic details:");
    }
  }, STARTUP_TIMEOUT_MS);

  window.addEventListener("unhandledrejection", function(e) {
    var reason = e.reason ? (e.reason.stack || e.reason.message || e.reason.toString()) : e.toString();
    log("Unhandled promise rejection: " + reason);
    error("WebAssembly / Script Error", "An unhandled promise rejection occurred during dashboard startup:");
  });

  window.addEventListener("error", function(e) {
    var msg = e.error ? (e.error.stack || e.error.message || e.message) : (e.message || e.toString());
    log("Runtime error: " + msg);
    error("CADE GUI Runtime Error", "A runtime error occurred during initialization:");
  });
})();
</script>
<link data-trunk rel="rust" data-wasm-opt="0" />
</head>
<body class="bg-[#0f1115] text-[#e5e7eb]">
<div id="cade-loader" class="cade-loader">
  <div class="cade-spinner"></div>
  <div style="font-weight: 500; color: #e5e7eb;">Loading CADE Dashboard…</div>
</div>
<div id="cade_gui_canvas" class="h-screen w-screen flex"></div>
</body>
</html>
