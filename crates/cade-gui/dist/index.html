<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CADE Dashboard</title>
<base href="/dashboard/">
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0f1115;
    color: #e5e7eb;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #cade_gui_canvas {
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    display: flex;
    position: absolute;
    inset: 0;
  }
  .cade-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f1115;
    color: #9ca3af;
    font-size: 14px;
  }
  #cade-loader[data-dismissed="true"] {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    opacity: 0 !important;
  }
  .cade-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #272833;
    border-top-color: #ff7c5c;
    border-radius: 50%;
    animation: cade-spin 0.8s linear infinite;
  }
  @keyframes cade-spin {
    to { transform: rotate(360deg); }
  }
</style>
<!-- Add Tailwind CSS for pixel-perfect design matching CADE -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cadeDark: '#0f1115',
          cadeCard: '#16171d',
          cadeBorder: '#272833',
          cadeAccent: '#ff7c5c',
        }
      }
    }
  }
</script>

<script>
  window.__cade_diag = [];
  window.cadeLog = function(msg) {
    var line = "[" + new Date().toISOString().slice(11, 19) + "] " + msg;
    window.__cade_diag.push(line);
    console.log("[CADE]", msg);
  };
  function cadeLog(msg) {
    window.cadeLog(msg);
  }
  function dismissLoader() {
    var loader = document.getElementById("cade-loader");
    if (loader) {
      loader.dataset.dismissed = "true";
      loader.style.display = "none";
      loader.style.visibility = "hidden";
      loader.style.pointerEvents = "none";
      try { loader.remove(); } catch (e) {}
    }
  }
  function reportCadeError(title, detail) {
    var loader = document.getElementById("cade-loader");
    if (loader && !loader.dataset.dismissed && !loader.dataset.error) {
      loader.dataset.error = "true";
      loader.style.display = "flex";
      loader.style.visibility = "visible";
      loader.style.pointerEvents = "auto";
      var diagText = (window.__cade_diag && window.__cade_diag.length > 0) ? window.__cade_diag.join("\n") : "No diagnostic logs captured.";
      loader.innerHTML = '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-weight:600;color:#ef4444;font-size:16px;margin-bottom:8px;">' + title + '</div>' +
        '<div style="color:#9ca3af;font-size:13px;max-width:520px;text-align:center;margin-bottom:12px;">' + detail + '</div>' +
        '<pre style="background:#16171d;color:#f87171;padding:12px;border-radius:8px;font-size:11px;max-width:560px;max-height:160px;overflow:auto;text-align:left;white-space:pre-wrap;border:1px solid #272833;margin-bottom:16px;">' + diagText + '</pre>' +
        '<div style="display:flex;gap:12px;">' +
        '<button onclick="location.reload()" style="background:#ff7c5c;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;">Reload</button>' +
        '<button onclick="location.href=location.pathname+\'?_t=\'+Date.now()" style="background:#272833;color:#e5e7eb;border:1px solid #3f3f46;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;">Bypass Cache & Reload</button>' +
        '</div>';
    }
  }
  window.addEventListener("TrunkApplicationStarted", function() {
    window.cadeLog("TrunkApplicationStarted caught by window listener.");
    dismissLoader();
  });
  var checkInterval = setInterval(function() {
    var canvas = document.getElementById("cade_gui_canvas");
    if (canvas && canvas.children.length > 0) {
      clearInterval(checkInterval);
      window.cadeLog("Canvas children detected (" + canvas.children.length + "). Dismissing loader.");
      dismissLoader();
    }
  }, 100);
  window.setTimeout(function() {
    reportCadeError("CADE Dashboard Startup Timeout", "The WebAssembly application did not initialize within 10 seconds. Diagnostic details:");
  }, 10000);
  window.addEventListener("unhandledrejection", function(e) {
    var reason = e.reason ? (e.reason.stack || e.reason.message || e.reason.toString()) : e.toString();
    window.cadeLog("Unhandled promise rejection: " + reason);
    reportCadeError("WebAssembly / Script Error", "An unhandled promise rejection occurred during dashboard startup:");
  });
  window.addEventListener("error", function(e) {
    var msg = e.error ? (e.error.stack || e.error.message || e.message) : (e.message || e.toString());
    window.cadeLog("Runtime error: " + msg);
    reportCadeError("CADE GUI Runtime Error", "A runtime error occurred during initialization:");
  });
</script>

<script type="module">
window.cadeLog?.("Starting WASM loader module...");
import init, * as bindings from '/dashboard/cade-gui-c10319d19a6f6ec9.js';
window.wasmBindings = bindings;
window.cadeLog?.("JS bindings loaded.");

try {
  window.cadeLog?.("Attempting WebAssembly.instantiateStreaming on /dashboard/cade-gui-c10319d19a6f6ec9_bg.wasm");
  const wasm = await init({ module_or_path: '/dashboard/cade-gui-c10319d19a6f6ec9_bg.wasm' });
  window.cadeLog?.("Streaming WASM instantiation succeeded.");
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
  dismissLoader();
} catch (streamErr) {
  try {
    window.cadeLog?.("Streaming instantiation failed: " + (streamErr.message || streamErr) + "; trying raw arrayBuffer fallback...");
    const resp = await fetch('/dashboard/cade-gui-c10319d19a6f6ec9_bg.wasm');
    if (!resp.ok) {
      throw new Error("Failed to fetch WASM binary: HTTP " + resp.status + " " + resp.statusText);
    }
    const bytes = await resp.arrayBuffer();
    window.cadeLog?.("Fetched " + bytes.byteLength + " bytes of WASM. Compiling WebAssembly.Module...");
    const compiled = await WebAssembly.compile(bytes);
    const wasm = await init({ module_or_path: compiled });
    window.cadeLog?.("ArrayBuffer fallback WASM instantiation succeeded.");
    dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
    dismissLoader();
  } catch (err) {
    const errDetail = err.stack || err.message || err.toString();
    window.cadeLog?.("Fatal WASM startup error: " + errDetail);
    reportCadeError("WebAssembly Initialization Failed", "Could not load or compile the dashboard WebAssembly bundle:");
  }
}
</script>
