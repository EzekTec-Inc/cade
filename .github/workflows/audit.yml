# Cargo dependency vulnerability scan (P3-2).
#
# Runs `cargo audit` against the committed `Cargo.lock` on every PR and
# push that touches the dependency manifest, plus a daily schedule to
# catch advisories disclosed after a merge. No advisory exclusions are
# committed; scan the lockfile with cargo-audit's default policy.
#
# Exit behaviour (from `cargo audit` default):
#   - Hard vulnerabilities          → non-zero exit, CI fails
#   - Unmaintained / unsound / yanked crates → warnings, CI passes
# Advisory exclusions must be explicitly committed and justified before
# they can affect CI.

name: Security audit

on:
  pull_request:
    branches: [master, main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  push:
    branches: [master, main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # Daily at 06:00 UTC — catches advisories published after a PR merges.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Run cargo audit
        run: cargo audit
